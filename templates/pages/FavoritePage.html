<div class="favorites-page">
  <h1 class="page-hero">
    <span class="basics">Favorites</span>
    <span class="charm" data-favorites-count></span>
  </h1>

  <section class="favorites-section">
    <div class="favorites-grid" data-favorites-list></div>
    <div class="favorites-empty" data-favorites-empty hidden>
      <p data-empty-message>No favorites yet.</p>
      <a href="#/shop/woman" data-empty-link>Back to new arrivals</a>
      <button class="btn btn--ghost" type="button" data-clear-search hidden>Clear search</button>
    </div>
  </section>

  <template data-favorite-card>
    <article class="tile">
      <div class="tile__media" data-media>
        <img class="tile__image" data-image width="600" height="800" alt="" decoding="async">
      </div>

      <div class="credits">
        <p class="card__name" data-name></p>
        <p class="price" data-price></p>
        <button class="favorite-toggle favorite-toggle--active" type="button" data-favorite-toggle
          aria-pressed="true"></button>
      </div>
      <div class="card__actions">
        <button class="btn btn--ghost add-to-bag" type="button" data-add-to-bag>Add to bag</button>
      </div>
    </article>
  </template>
</div>
